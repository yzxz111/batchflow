name: build-and-test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: batchflow_test
          POSTGRES_USER: batchflow
          POSTGRES_PASSWORD: batchflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U batchflow -d batchflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BATCHFLOW_TEST_DB_URL: jdbc:postgresql://localhost:5432/batchflow_test
      BATCHFLOW_TEST_DB_USER: batchflow
      BATCHFLOW_TEST_DB_PASSWORD: batchflow_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Frontend install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Frontend tests
        working-directory: web
        run: pnpm test
      - name: Frontend type check and build
        working-directory: web
        run: pnpm build
      - name: Backend tests and package
        run: mvn -B -f backend/pom.xml verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
