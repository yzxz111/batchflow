name: batchflow
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: batchflow
      POSTGRES_USER: batchflow
      POSTGRES_PASSWORD: ${BATCHFLOW_DB_PASSWORD:-batchflow_local_demo}
    ports:
      - "127.0.0.1:15439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batchflow -d batchflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: batchflow
      RABBITMQ_DEFAULT_PASS: ${BATCHFLOW_RABBIT_PASSWORD:-batchflow_local_demo}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    image: batchflow:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: &app-environment
      DATABASE_URL: jdbc:postgresql://postgres:5432/batchflow
      DATABASE_USER: batchflow
      DATABASE_PASSWORD: ${BATCHFLOW_DB_PASSWORD:-batchflow_local_demo}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: batchflow
      SPRING_RABBITMQ_PASSWORD: ${BATCHFLOW_RABBIT_PASSWORD:-batchflow_local_demo}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
    command: ["--server.address=0.0.0.0", "--server.port=18090", "--app.role=api", "--app.queue-mode=rabbitmq", "--app.storage-dir=/app/storage"]
    ports:
      - "127.0.0.1:18090:18090"
    volumes:
      - import-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:18090/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10
    restart: unless-stopped

  worker:
    image: batchflow:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: *app-environment
    command: ["--server.address=0.0.0.0", "--server.port=18091", "--app.role=worker", "--app.queue-mode=rabbitmq", "--app.storage-dir=/app/storage", "--app.worker.batch-delay-ms=0"]
    volumes:
      - import-storage:/app/storage
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:18091/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  import-storage:
